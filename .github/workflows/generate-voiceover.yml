name: Generate Voiceover with Microsoft VibeVoice

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  synthesize-voiceover:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install torch torchaudio soundfile numpy scipy transformers accelerate edge-tts

      - name: Download Microsoft VibeVoice Model & Preset
        run: |
          python -c "
          from huggingface_hub import snapshot_download
          print('Downloading microsoft/VibeVoice-Realtime-0.5B from Hugging Face...')
          snapshot_download(repo_id='microsoft/VibeVoice-Realtime-0.5B')
          print('Model downloaded successfully.')
          " || echo "Model will download on demand during script execution"

      - name: Generate Voiceover & Timestamps
        run: |
          python tts.py script.txt

      - name: Verify Audio Outputs
        run: |
          ls -la audio/
          test -f audio/vo.mp3 || ffmpeg -i audio/vo.wav -codec:a libmp3lame -b:a 192k audio/vo.mp3
          test -f audio/timestamps.json

      - name: Upload Voiceover Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voiceover-artifact
          path: |
            audio/vo.mp3
            audio/vo.wav
            audio/timestamps.json
          retention-days: 7
